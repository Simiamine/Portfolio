<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Amine M'ZALI - Portfolio</title>
  <script>
    // Détecter la langue du navigateur
    const userLang = navigator.language || navigator.userLanguage;

    // Vérifier si la langue est le français
    if (userLang.startsWith('fr')) {
      window.location.href = 'fr.html';
    } else {
      window.location.href = 'en.html';
    }
  </script>
  <noscript>
    <!-- Si JavaScript est désactivé, rediriger vers la version française -->
    <meta http-equiv="refresh" content="0; url=fr.html">
  </noscript>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #5e2933 0%, #815443 100%);
      color: white;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Redirection en cours...</p>
  </div>
</body>
</html>
