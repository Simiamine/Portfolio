        <!-- MODE SOMBRE -->
        <style>
            /* Transition smooth */
            body, .navbar, .modal-content, .services-thumb, .timeline-content, .about, .featured, .clients {
                transition: background-color 0.3s ease, color 0.3s ease;
            }
            
            /* Mode sombre */
            body.dark-mode {
                background-color: #0f0f0f !important;
                color: #e5e5e5 !important;
            }
            
            body.dark-mode .navbar .container,
            body.dark-mode .modal-content,
            body.dark-mode .services-thumb,
            body.dark-mode .timeline-content {
                background-color: #1e1e1e !important;
                color: #e5e5e5 !important;
            }
            
            body.dark-mode .about,
            body.dark-mode .featured,
            body.dark-mode .clients {
                background-color: #1a1a1a !important;
            }
            
            body.dark-mode h1, body.dark-mode h2:not(.text-white), 
            body.dark-mode h3, body.dark-mode h4, body.dark-mode h5, body.dark-mode h6 {
                color: #e5e5e5 !important;
            }
            
            body.dark-mode p, body.dark-mode li, body.dark-mode small {
                color: #b4b4b4 !important;
            }
            
            /* Bouton thème */
            .theme-toggle-btn {
                background: none;
                border: 1px solid #e9eaeb;
                border-radius: 50%;
                width: 44px;
                height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.3s;
                padding: 0;
            }
            
            .theme-toggle-btn:hover {
                background-color: #815443;
                border-color: #815443;
            }
            
            .theme-toggle-btn svg {
                width: 20px;
                height: 20px;
                stroke: currentColor;
                stroke-width: 2;
                fill: none;
            }
            
            .sun-icon { display: block; }
            .moon-icon { display: none; }
            
            body.dark-mode .sun-icon { display: none; }
            body.dark-mode .moon-icon { display: block; }
            
            body.dark-mode .theme-toggle-btn {
                border-color: #2a2a2a;
            }
        </style>
    </head>
